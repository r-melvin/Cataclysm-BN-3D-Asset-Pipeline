name: voxelizer CLI

on:
  push:
    paths:
      - "tools/voxelizer-cli/**"
      - ".github/workflows/voxelizer-cli.yml"
  pull_request:
    paths:
      - "tools/voxelizer-cli/**"
      - ".github/workflows/voxelizer-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: tools/voxelizer-cli/go.sum
      - name: Check formatting
        working-directory: tools/voxelizer-cli
        run: test -z "$(gofmt -l backend cmd)"
      - name: Test
        working-directory: tools/voxelizer-cli
        run: go test ./...
      - name: Vet
        working-directory: tools/voxelizer-cli
        run: go vet ./...
      - name: Build
        working-directory: tools/voxelizer-cli
        run: go build -o "$RUNNER_TEMP/bn3d-voxelizer" ./cmd/voxelizer

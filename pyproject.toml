[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bn3d-asset-pipeline"
version = "0.1.0"
description = "Offline sprite and voxel asset preparation for Cataclysm: Bright Nights 3D"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=10.0"]

[project.scripts]
sprite-pipeline = "sprite_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

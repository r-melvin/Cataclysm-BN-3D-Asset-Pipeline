name: asset pipeline CLI

on:
  push:
    paths:
      - "src/sprite_pipeline/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "tools/voxelizer-backend/**"
      - ".github/workflows/asset-pipeline.yml"
  pull_request:
    paths:
      - "src/sprite_pipeline/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "tools/voxelizer-backend/**"
      - ".github/workflows/asset-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test unified CLI
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: tools/voxelizer-backend/go.sum
      - name: Check formatting
        working-directory: tools/voxelizer-backend
        run: test -z "$(gofmt -l backend cmd)"
      - name: Test
        working-directory: tools/voxelizer-backend
        run: go test ./...
      - name: Vet
        working-directory: tools/voxelizer-backend
        run: go vet ./...
      - name: Build
        working-directory: tools/voxelizer-backend
        run: go build -o "$RUNNER_TEMP/bn3d-voxelizer-backend" ./cmd/voxelizer
